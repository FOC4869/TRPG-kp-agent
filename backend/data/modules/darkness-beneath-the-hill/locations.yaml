topology_review:
  status: reviewed_scene_abstraction
  issue: map_topology
  maps:
  - tunnel_map
  - caverns_map
  - lair_detail_map
  notes:
  - 逐图查看后登记粗粒度场景图；存在显式project adaptation，不宣称精确重建全部通道。
  - 峭壁门禁、高差、陷坑、笼门、传送付费分别有traversal条件，不能仅按bidirectional判断无条件可走。
  - 地图6是巢窟内遗书标记，不生成新房间；11是巢穴父区域，12至15为内部区域。
  - 隐藏怪物窄道不加入调查员路线；像素比例不转换为时间/距离；追逐适配仍未实现。
