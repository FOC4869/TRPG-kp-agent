<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>岭下暗影 · 全量素材预览</title><style>body{margin:0;background:#121110;color:#e4cfaa;font:16px system-ui}h1,p,.controls{margin:20px}select,button{padding:8px;margin:4px;background:#26211b;color:inherit;border:1px solid #796443}.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#292929}.stage.wide{aspect-ratio:21/9}.bg{width:100%;height:100%;object-fit:cover}.npc{position:absolute;height:92%;width:auto;right:10%;bottom:0}.dialog{position:absolute;left:5%;right:5%;bottom:4%;padding:20px;background:#15110ee8;border:1px solid #967749}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:20px}figure{margin:0;background:#26221c}figure img{width:100%;height:220px;object-fit:contain;background:repeating-conic-gradient(#444 0% 25%,#666 0% 50%) 50%/20px 20px}figcaption{padding:10px}</style><h1>岭下暗影 · 全量素材预览</h1><p>守秘人本地审阅：包含后期场景与生物剧透。全部24项素材已由用户审阅通过。实际生物显示比例仍待游戏UI确定；素材不证明规则和运行时就绪。</p><div class="controls"><select id="scene"></select><select id="actor"></select><button id="wide">切换16:9／21:9</button></div><section class="stage" id="stage"><img class="bg" id="bg"><img class="npc" id="npc"><div class="dialog">合成检查：背景、透明立绘和对话区域独立叠加。这里的说明不写入剧情。</div></section><div class="grid"><figure><img loading="lazy" src="assets/default_atmosphere-v1.webp"><figcaption>默认背景 · accepted</figcaption></figure><figure><img loading="lazy" src="assets/bg_winscott_house-v1.webp"><figcaption>文斯考特宅 · accepted</figcaption></figure><figure><img loading="lazy" src="assets/bg_house_cellar-v1.webp"><figcaption>文斯考特宅地窖 · accepted</figcaption></figure><figure><img loading="lazy" src="assets/bg_john_hay_library-v1.webp"><figcaption>约翰·海伊图书馆／普罗维登斯文献馆 · accepted</figcaption></figure><figure><img loading="lazy" src="assets/bg_old_tunnel-v1.webp"><figcaption>旧隧道／下行通道 · accepted</figcaption></figure><figure><img loading="lazy" src="assets/bg_river_brick_wall-v1.webp"><figcaption>河道方向砖墙 · accepted</ age_area-v1.webp"}, {"id": "bg_laboratory", "label": "实验室", "src": "assets/bg_laboratory-v1.webp"}, {"id": "bg_portal_area", "label": "传送门所在区域", "src": "assets/bg_portal_area-v1.webp"}, {"id": "bg_portal_exit_cavern", "label": "波塔克西特出口洞窟", "src": "assets/bg_portal_exit_cavern-v1.webp"}]};const scene=document.getElementById('scene'),actor=document.getElementById('actor');for(const x of d.backgrounds)scene.add(new Option(x.label,x.src));actor.add(new Option('无立绘',''));for(const x of d.sprites)actor.add(new Option(x.label,x.src));scene.onchange=()=>document.getElementById('bg').src=scene.value;actor.onchange=()=>{let n=document.getElementById('npc');n.hidden=!actor.value;if(actor.value)n.src=actor.value};document.getElementById('wide').onclick=()=>document.getElementById('stage').classList.toggle('wide');scene.onchange();actor.onchange();</script></html>
