      锣被敲响后，一个妖鬼会在1D10+2轮后赶到。如果局面开始对蛇人不利，他也会通过传送门逃离这里。 \n这个实验室极其易爆。明火、枪击或翻倒溶液使之混合都会导致爆炸，在1码范围内造成3D6伤害，\n\
