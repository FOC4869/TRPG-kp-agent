      途。 \n在斯西亚·瑞斯醒着的时候暗中观察他的调查员需要每个人都在潜行检定上成功。只要有一个人失败，\n斯西亚·瑞斯就会警觉起来并发现调查员8。如果他未能发现调查员，他们可以继续观察他或试图攻击他—\n\
