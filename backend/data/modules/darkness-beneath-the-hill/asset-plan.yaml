      在另一个陌生的洞窟之中，这个洞窟最终通向波塔克西特地区的河流，位于普罗维登斯以南5英里处。在\n使用者传送到的那个地方，他们身后的岩壁上会刻有相同的螺旋线，这能让他们以同样的方式传送回斯西\n\
      亚·瑞斯的房间中（需要消耗1点魔法值与1点理智值），妖鬼与退化人无法使用这道传送门。 \n斯西亚·瑞斯极少前往其他地方。他把大部分醒着的时间都用在于实验室中进行魔法实验或学习卷轴\n\
      上。他偶尔会在隧道中寻找某种真菌。有三个较为聪明而且受过训练的退化人作为他的助手，帮助他搬运\n物品。他有时同样也会前往神殿冥想或去往音乐室放松。他每隔几天进食一次，在那时他会活吞下一整个\n\
      退化人婴儿（目睹如此恐怖的进食场面需要进行一个理智检定，造成0/1D2的理智值损失）。他只会偶尔\n睡眠，通常是在进食之后。由于他无法合眼，而且一般只是坐在工作间小睡一会——调查员有可能无法意\n\
      识到他正在睡觉，除非他们观察到了他正一动不动。在他睡觉时，他的助手也会同样睡眠。 \n擅长隐蔽的调查员有可能得以趁斯西亚·瑞斯睡觉或专心工作时观察或接近他。那些辨识出了传送门正\n\
