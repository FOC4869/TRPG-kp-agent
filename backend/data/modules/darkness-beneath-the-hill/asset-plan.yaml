      \ warm stone cavern. Cage empty for separate NPC layers; no captives, infants\
      \ or creatures.\nReference image is STYLE ONLY. Do NOT copy house furniture/architecture\
      \ into underground scenes. Match realistic painterly material detail, restrained\
      \ ochre and charcoal and readable darks. Render single wide landscape 16:9,\
      \ no panels, no letters, no UI. No human, NPC, creature or silhouette baked\
      \ in."
