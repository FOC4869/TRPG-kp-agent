      \ \n在城中有数座图书馆，而且还有普罗维登斯日报，罗德岛州年代最久远的日报的报社。而其中两座图\n书馆是关于普罗维登斯早期历史的尤其有用的信息来源。它们都位于文斯考特宅以北大约半英里的地方，\n\
