    - 1080
    style_version: 0.1.0
    prompt: "Realistic painterly 1920s Providence horror, restrained ochre charcoal\
      \ palette, readable cool darks, subtle brushwork. No text, UI, frame or watermark.\
      \ Cosmetic interpretation must not add gameplay facts. Background only, no characters,\
      \ wide 16:9 1920x1080, sides for sprite and lower quarter dialogue-safe. Depict\
      \ 文斯考特宅地窖. Use only environmental facts from sources below; exclude NPCs, actions,\
      \ checks, secret traps and undiscovered clues. Map connectivity unresolved:\
      \ do not invent connected rooms. Shared image depicts common environment rather\
      \ than literal identical architecture. Sources:\nstory.md#entering-underground\n\
      \n进入地底 \n当调查员按照事先约定的时间返回乔什的房屋时，他们会发现屋内无人前来应门。房门没有锁，但向\n屋内呼喊不会得到任何回应。 \n当调查员们来到地下室之后，他们将发现一杯已经冷掉的咖啡。工具随意地被扔在一堵开了一个大洞\n\
      （大到足以让人通行）的砖墙旁。穿过这个洞，另一边是一条由砖搭建起来的隧道，通向某处看起来像是\n一个巨大的天然洞穴的地方（此处默认调查员们都记得带上了手电筒）。\
      \ \n成功的追踪技能检定能够让调查员们发现一个男子的足迹通向了这条隧道的深处，但在那之后就因为\n挖掘工作产生的碎石与尘土而无法辨别。隧道向东大约五十英尺的地方看起来就在不久之前完全崩塌了。\n\
      而沿隧道西行大约二百英尺后，调查员们会发现一些古时人类留下的遗骸，这六具遗骸在距离南墙上的一\n处入口十英尺远的地方。其中三具骸骨的四肢上还戴有铁质的镣铐。一个成功的科学（生物学）或医学技\n\
      能检定可以辨别出这些骸骨大约有150年的历史。而成功的考古或历史技能检定能辨别出那些没有镣铐的\n尸骨上的残留衣物看起来是来自殖民时代的。大多数骨骼都已经残缺，可能是暴力手段或虫蛀导致的。成\n\
      功的侦查检定能揭示出衣物上有撕扯的痕迹与血迹（如果调查员们仔细靠近并观察了这些破布，那么这里\n就不需要侦查检定也能发现线索）。 \n隧道在继续向西延伸半英里后的尽头是一道古老的砖墙（如果通过了一个导航技能检定，调查员将意\n\
      识到他们现在距离河道很近）。在南墙上的开口处附近（在遗骸区域），调查员能通过成功的侦查检定发\n现一截土耳其香烟的烟头（被文斯考特遗留在这里）。墙上的开口通向一条向下延伸的通道。这条通道蜿\n\
      蜒而曲折，长度约半英里，并向下延伸了大约两百英尺的深度。在走过一个弯道后，调查员们将会看到一\n处稳定但却昏暗的亮光。而随着他们沿通道径直前行，这亮光也开始愈发明亮，但他们无法知晓光亮的来\n\
      源究竟为何。很快，这条通道就将他们引至了一处由散发着磷光的地衣所照亮的庞大房间之中。 \n幽暗之门 \n\n\nPRIORITY COMPOSITION:\
      \ Focus on an ordinary renovation cellar with an opened brick partition revealing\
      \ darkness, no remains or hidden clues shown.\nReference image is STYLE ONLY.\
      \ Do NOT copy house furniture/architecture into underground scenes. Match realistic\
      \ painterly material detail, restrained ochre and charcoal and readable darks.\
      \ Render single wide landscape 16:9, no panels, no letters, no UI. No human,\
      \ NPC, creature or silhouette baked in."
